{% extends "base.html" %}
{% block content %}
<div class="card details">
    <h1>{{ product.name }}</h1>
    <table class="details-table">
        <tr><th>Name</th><td>{{ product.name }}</td></tr>
        <tr><th>Price</th><td>${{ "%.2f"|format(product.price) }}</td></tr>
        <tr><th>In stock</th><td>{% if product.in_stock %}Yes{% else %}No{% endif %}</td></tr>
        <tr><th>Description</th><td>{{ product.description }}</td></tr>
        <tr><th>Category</th><td>{{ product.category }}</td></tr>
    </table>
    <div class="actions">
        <a class="btn" href="{{ url_for('list_products') }}">Back to Products</a>
        <form method="post" action="{{ url_for('delete_product', product_id=product.id) }}" onsubmit="return confirm('Delete this product?');">
            <button class="btn danger" type="submit">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
